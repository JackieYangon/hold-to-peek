    <path d="M477 504H518M511 498L518 504L511 510" stroke="#9AB19F" stroke-width="1.5"/>
    <text x="541" y="510" fill="#4B6958" font-size="15">松手继续</text>
    <text x="1146" y="510" text-anchor="end" fill="#6D8372" font-size="13">开发中 / DESIGNED FOR A SINGLE SCREEN</text>
