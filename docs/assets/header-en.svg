    <rect x="1057" y="252" width="65" height="23" rx="11.5" fill="#2B5146"/>
    <text x="1089" y="268" text-anchor="middle" fill="#D9ECCB" font-size="11">Holding</text>
    <text x="863" y="306" fill="#B7CEC1" font-size="14">01  Open Settings</text>
    <rect x="856" y="319" width="272" height="39" rx="8" fill="#C4EB9F"/>
