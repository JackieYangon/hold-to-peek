    <text x="863" y="389" fill="#B7CEC1" font-size="14">03  Check the tutorial values</text>
    <path d="M819 297L819 331L828 321L838 334L845 328L835 315L849 312Z" fill="#173E35" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <text x="850" y="450" fill="#607A68" font-size="11">Interaction concept · Not an app screenshot</text>

    <path d="M52 470H1148" stroke="#CBDACD"/>
    <text x="54" y="510" fill="#4B6958" font-size="15">Capture</text>
